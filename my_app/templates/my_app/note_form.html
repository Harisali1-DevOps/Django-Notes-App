<!DOCTYPE html>
<html>
<head>
    <title>{% if note %}Edit Note{% else %}Add Note{% endif %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.25); }
        h1 { margin-bottom: 25px; color: #764ba2; font-size: 1.8rem; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input[type="text"], textarea { width: 100%; padding: 12px 14px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #764ba2; }
        textarea { resize: vertical; min-height: 120px; }
        .colors { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .color-option { position: relative; }
        .color-option input { position: absolute; opacity: 0; }
        .color-option label { display: block; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; margin: 0; border: 3px solid transparent; transition: transform 0.2s, border-color 0.2s; }
        .color-option input:checked + label { border-color: #333; transform: scale(1.15); }
        .c-yellow { background: #ffe082; }
        .c-blue   { background: #64b5f6; }
        .c-green  { background: #81c784; }
        .c-red    { background: #e57373; }
        .c-purple { background: #ba68c8; }
        .btn-row { display: flex; gap: 12px; }
        button, .cancel-btn { padding: 13px 26px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; text-align: center; }
        button { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; flex: 1; }
        button:hover { opacity: 0.9; }
        .cancel-btn { background: #eee; color: #555; flex: 1; }
        .cancel-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{% if note %}✏️ Edit Note{% else %}➕ Add New Note{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{% if note %}{{ note.title }}{% endif %}" required>
            <label for="content">Content</label>
            <textarea id="content" name="content" required>{% if note %}{{ note.content }}{% endif %}</textarea>
            <label>Color</label>
            <div class="colors">
                <div class="color-option">
                    <input type="radio" id="yellow" name="color" value="yellow" {% if not note or note.color == "yellow" %}checked{% endif %}>
                    <label for="yellow" class="c-yellow"></label>
                </div>
                <div class="color-option">
                    <input type="radio" id="blue" name="color" value="blue" {% if note.color == "blue" %}checked{% endif %}>
                    <label for="blue" class="c-blue"></label>
                </div>
                <div class="color-option">
                    <input type="radio" id="green" name="color" value="green" {% if note.color == "green" %}checked{% endif %}>
                    <label for="green" class="c-green"></label>
                </div>
                <div class="color-option">
                    <input type="radio" id="red" name="color" value="red" {% if note.color == "red" %}checked{% endif %}>
                    <label for="red" class="c-red"></label>
                </div>
                <div class="color-option">
                    <input type="radio" id="purple" name="color" value="purple" {% if note.color == "purple" %}checked{% endif %}>
                    <label for="purple" class="c-purple"></label>
                </div>
            </div>
            <div class="btn-row">
                <button type="submit">{% if note %}Save Changes{% else %}Create Note{% endif %}</button>
                <a href="{% url 'note_list' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
